<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>დავალება — CSS Orbiting Menu Animation</title>
  <meta name="description" content="წრიული ორბიტალური ანიმაცია სუფთა CSS-ით">
  
  <!-- Google Fonts: Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- ==========================================================================
       დამატებითი გამოწვევები: მართვის პანელი (სუფთა CSS, JavaScript-ის გარეშე)
       ========================================================================== -->
  <div class="controls">
    <label class="ctl"><input type="checkbox" id="reverse"> ↺ Reverse</label>
    <span class="sep"></span>
    <label class="ctl"><input type="radio" name="speed" id="speed-slow" checked> 60s</label>
    <label class="ctl"><input type="radio" name="speed" id="speed-mid"> 30s</label>
    <label class="ctl"><input type="radio" name="speed" id="speed-fast"> 20s</label>
  </div>

  <!-- ==========================================================================
       ORBITING MENU — ძირითადი სტრუქტურა
       ========================================================================== -->
  <div class="menu">
    <!-- ცენტრალური ავატარი / ბირთვი -->
    <div class="avatar" title="Center Core"></div>

    <!-- მბრუნავი ორბიტა 8 ელემენტით -->
    <ol class="orbit">
      <!-- ელემენტი 1: Onboarding -->
      <li class="adduser">
        <div class="item-wrap">
          <div class="item" data-category="Onboarding">
            <div class="icon">
              <svg><use href="#adduser"></use></svg>
            </div>
          </div>
        </div>
      </li>

      <!-- ელემენტი 2: Time & Attendance -->
      <li class="calendar">
        <div class="item-wrap">
          <div class="item" data-category="Time & Attendance">
            <div class="icon">
              <svg><use href="#calendar"></use></svg>
            </div>
          </div>
        </div>
      </li>

      <!-- ელემენტი 3: Analytics & Reporting -->
      <li class="chart">
        <div class="item-wrap">
          <div class="item" data-category="Analytics & Reporting">
            <div class="icon">
              <svg><use href="#chart"></use></svg>
            </div>
          </div>
        </div>
      </li>

      <!-- ელემენტი 4: Disciplinary -->
      <li class="gavel">
        <div class="item-wrap">
          <div class="item" data-category="Disciplinary">
            <div class="icon">
              <svg><use href="#gavel"></use></svg>
            </div>
          </div>
        </div>
      </li>

      <!-- ელემენტი 5: Travel & Requisitions -->
      <li class="plane">
        <div class="item-wrap">
          <div class="item" data-category="Travel & Requisitions">
            <div class="icon">
              <svg><use href="#plane"></use></svg>
            </div>
          </div>
        </div>
      </li>

      <!-- ელემენტი 6: Exit & Off-boarding -->
      <li class="logout">
        <div class="item-wrap">
          <div class="item" data-category="Exit & Off-boarding">
            <div class="icon">
              <svg><use href="#logout"></use></svg>
            </div>
          </div>
        </div>
      </li>

      <!-- ელემენტი 7: Leaves & Holidays -->
      <li class="drink">
        <div class="item-wrap">
          <div class="item" data-category="Leaves & Holidays">
            <div class="icon">
              <svg><use href="#drink"></use></svg>
            </div>
          </div>
        </div>
      </li>

      <!-- ელემენტი 8: HR Information System -->
      <li class="fingerprint">
        <div class="item-wrap">
          <div class="item" data-category="HR Information System">
            <div class="icon">
              <svg><use href="#fingerprint"></use></svg>
            </div>
          </div>
        </div>
      </li>
      <!-- ელემენტი 9: Rewards & Recognition (დამატებითი) -->
      <li class="star">
        <div class="item-wrap">
          <div class="item" data-category="Rewards & Recognition">
            <div class="icon">
              <svg><use href="#star"></use></svg>
            </div>
          </div>
        </div>
      </li>
    </ol>
  </div>
